name: Validate model
on:
  push:
    paths: ['model/**', 'app/model.js', 'tools/**']
  pull_request:
    paths: ['model/**', 'app/model.js', 'tools/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.js model
